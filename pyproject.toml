[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-book-writer"
version = "1.0.0"
description = "Talk to Jarvis to plan, write, edit and listen to your books (Gemini-powered)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "PyQt6>=6.6", "requests>=2.31", "websockets>=13", "python-docx>=1.1", "edge-tts>=6.1",
  "imageio-ffmpeg>=0.5", "numpy>=1.26", "openwakeword>=0.6", "onnxruntime>=1.17", "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis-books = "jarvis_books.app:main"

[tool.setuptools.packages.find]
include = ["jarvis_books*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
